
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Budget Tracker</title>

    <!-- Link CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main heading -->
    <header>
        <h1>My Budget Tracker</h1>
        <p>Track your income and expenses in one place.</p>
    </header>

    <main>

        <!-- Add Expense Section -->
        <section class="expense-form" id="add-expense">
            <h2>Add Expense</h2>

            <div class="input-group">
                <label for="expense-name">Expense Name</label>
                <input type="text" id="expense-name"
                    placeholder="Enter expense name">
            </div>

            <div class="input-group">
                <label for="amount">Amount</label>
                <input type="number" id="amount"
                    placeholder="Enter amount">
            </div>

            <div class="input-group">
                <label for="category">Category</label>
                <select id="category">
                    <option value="">Select category</option>
                    <option value="food">Food</option>
                    <option value="transport">Transport</option>
                    <option value="shopping">Shopping</option>
                    <option value="bills">Bills</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <button type="button">Add Expense</button>
        </section>

        <!-- Your Expenses Section -->
        <section class="expenses-list" id="your-expenses">
            <h2>Your Expenses</h2>
            <p class="empty-message">No expenses yet.</p>
        </section>

    </main>

    <!-- Footer -->
    <footer>
        <p>My Budget Tracker &copy; 2026</p>
    </footer>

</body>
</html>
